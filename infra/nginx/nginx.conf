pid /path/to/EdgeInference/infra/nginx/nginx.pid;

events {
    worker_connections 256;
}

http {
    default_type  application/json;

    access_log /path/to/EdgeInference/infra/nginx/access.log;
    error_log  /path/to/EdgeInference/infra/nginx/error.log warn;

    # Rate limiting: 6 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=6r/m;
    limit_req_status 429;

    # Upstream to Fastify gateway
    upstream gateway_upstream {
        server 127.0.0.1:8765;
        keepalive 8;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # Body limit
        client_max_body_size 12m;

        # Custom JSON error responses
        error_page 404 = @json_404;
        error_page 405 = @json_405;
        error_page 413 = @json_413;
        error_page 429 = @json_429;
        error_page 502 503 504 = @json_502;

        # Allowlisted inference endpoint
        location = /v1/chat/completions {
            # Method restriction: strictly POST -> 405 Method Not Allowed
            if ($request_method != POST) {
                return 405;
            }

            # Request rate limiting: 6 req/min, burst 3 without delay
            limit_req zone=api_limit burst=3 nodelay;

            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streaming optimization: disable buffering completely
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Extended timeouts for deep reasoning / token generation
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 5s;
        }

        # Health endpoint
        location = /health {
            if ($request_method != GET) {
                return 405;
            }

            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # Catch-all: reject unknown paths
        location / {
            return 404;
        }

        # Standardized Error Blocks
        location @json_404 {
            return 404 '{"error":{"message":"The requested endpoint does not exist.","type":"invalid_request_error","code":"not_found"}}';
        }

        location @json_405 {
            return 405 '{"error":{"message":"Method Not Allowed.","type":"invalid_request_error","code":"method_not_allowed"}}';
        }

        location @json_413 {
            return 413 '{"error":{"message":"Request body exceeds maximum size limit of 12MB.","type":"invalid_request_error","code":"payload_too_large"}}';
        }

        location @json_429 {
            return 429 '{"error":{"message":"Rate limit exceeded. Maximum 6 requests per minute allowed.","type":"rate_limit_error","code":"rate_limit_exceeded"}}';
        }

        location @json_502 {
            return 502 '{"error":{"message":"Gateway upstream service is unavailable.","type":"server_error","code":"bad_gateway"}}';
        }
    }
}
